name: container-smoke

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


on:
  pull_request:
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements*.txt"
      - "main.py"
      - "core/**"
      - "api/**"
      - "bridges/**"
      - "quant/**"
      - "config/**"
      - "sentinel/**"
      - ".github/workflows/container-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-backend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Configure offline synthetic CI environment (no exchange credentials)
        run: |
          cat > .env <<'EOF'
          APP_ENV=development
          API_AUTH_ENABLED=true
          API_KEYS=CI_DUMMY_KEY_FOR_DISPOSABLE_RUNNER
          BINANCE_EXECUTION_ENV=demo
          BINANCE_MARKET_DATA_MODE=mock
          BINANCE_CCXT_DEFAULT_TYPE=spot
          BINANCE_DEMO_API_KEY=
          BINANCE_DEMO_API_SECRET=
          BINANCE_TRADE_API_KEY=
          BINANCE_TRADE_API_SECRET=
          WORLD_SIMULATION_DEFAULT=false
          HYPOTHESIS_USE_LLM=false
          EOF
      - name: Start only databases and backend, no social or exchange accounts
        run: docker compose -f docker-compose.yml up --build -d backend_core
      - name: Assert responsive backend health and synthetic data provenance
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          url = "http://127.0.0.1:8000/api/v1/health"
          deadline = time.monotonic() + 120
          last_error = None
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=4) as response:
                      data = json.load(response)
                  assert data.get("status") == "ok", data
                  assert data.get("mock") is True, data
                  source = (data.get("market_data") or {}).get("source")
                  assert source == "synthetic_mock", data
                  print("SAFE_BACKEND_SMOKE_PASS", data["status"], source)
                  break
              except (OSError, ValueError) as exc:
                  last_error = exc
                  time.sleep(2)
          else:
              raise SystemExit(f"backend startup or health assertion failed: {last_error}")
          PY
      - name: Verify denied control command is audited and state DB is writable
        run: |
          python - <<'PY'
          import urllib.error
          import urllib.request
          req = urllib.request.Request(
              "http://127.0.0.1:8000/api/v1/mode",
              data=b'{}',
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              urllib.request.urlopen(req, timeout=8)
          except urllib.error.HTTPError as exc:
              assert exc.code == 401, f"unsafe unexpected control response {exc.code}"
          else:
              raise SystemExit("auth gate incorrectly accepted anonymous mutation")
          print("UNAUTHORIZED_MUTATION_REJECTED")
          PY
          docker compose -f docker-compose.yml exec -T backend_core python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          audit = Path("/app/logs/econith_audit.log")
          state = Path("/app/runtime-state/econith.sqlite")
          trade_state = Path("/app/runtime-state/trades.sqlite")
          assert audit.is_file() and state.is_file() and trade_state.is_file(), (
              audit, state, trade_state
          )
          entries = [json.loads(line) for line in audit.read_text(encoding="utf-8").splitlines()]
          assert any(row.get("decision") == "DENY" and row.get("path") == "/api/v1/mode"
                     for row in entries), "missing durable denial audit event"
          for file in (state, trade_state):
              with sqlite3.connect(file) as connection:
                  assert connection.execute("PRAGMA quick_check").fetchone()[0] == "ok"
          print("DURABLE_AUDIT_AND_BOTH_SQLITE_JOURNALS_PASS")
          PY
      - name: Collect sanitized container diagnostics on failure
        if: failure()
        run: docker compose -f docker-compose.yml ps && docker compose -f docker-compose.yml logs --tail=80 backend_core
      - name: Shut down disposable Docker stack
        if: always()
        run: docker compose -f docker-compose.yml down -v --remove-orphans
