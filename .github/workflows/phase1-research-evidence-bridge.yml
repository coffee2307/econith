name: ECONITH P1-08 offline original-source Research Bridge

on:
  pull_request:
    paths:
      - "ci/phase1_research_evidence_bridge.py"
      - "tests/test_phase1_research_evidence_bridge.py"
      - ".github/workflows/phase1-research-evidence-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Verify original-source receipt safety (synthetic sources only)
        run: python -m pytest tests/test_phase1_research_evidence_bridge.py -q --tb=short
