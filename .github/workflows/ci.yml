name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Root dev orchestration contracts
        working-directory: .
        run: node --test tests/node/runtime_services.test.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Repository hygiene guard
        run: python -m ci.repo_hygiene_check --root . --enforce
      - name: First-party tests
        run: python -m pytest tests/ -q --tb=short
      - name: Deploy gate unit smoke
        run: |
          python -c "from training.deploy_gate import evaluate_gate; ok, _ = evaluate_gate({'rows': 1000, 'annualized_sharpe': 0.5, 'max_drawdown': 0.1, 'evaluation_protocol': 'chronological_holdout_oos', 'signal_col': 'oos_prediction_1h', 'prediction_model_id': ['frozen-check']}); assert ok"
      - name: Paper soak checklist (env defaults)
        run: python -m scripts.paper_soak_check
      - name: World calibration smoke (fast file/metadata contract)
        run: python -m scripts.calibrate_world_ci_smoke


  container-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ECONITH_API_KEY: CI_ONLY_PLACEHOLDER_NOT_A_SECRET
      POSTGRES_PASSWORD: CI_ONLY_PLACEHOLDER_NOT_A_SECRET
      REDIS_PASSWORD: CI_ONLY_PLACEHOLDER_NOT_A_SECRET
    steps:
      - uses: actions/checkout@v4
      - name: Validate dev and production Compose without starting services
        run: |
          # Compose's env_file requires a local path. No credentials are used;
          # this job never connects to an exchange or starts a container.
          printf '# Disposable GitHub Actions config validation file\n' > .env
          printf '# Disposable GitHub Actions config validation file\n' > .env.production
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
          rm -f .env .env.production
