name: ECONITH P1 research-only OpenAI analyst opt-in adapter
on:
  push:
    branches:
      - 'experiment/phase1-optin-openai-analyst-research-*'
    paths:
      - 'ci/phase1_optin_openai_research_panel.py'
      - 'tests/test_phase1_optin_openai_research_panel.py'
      - 'docs/architecture/PHASE1_OPTIN_BOUNDED_OPENAI_ANALYSTS_20261020.md'
      - '.github/workflows/phase1-optin-openai-analysts.yml'
  pull_request:
    paths:
      - 'ci/phase1_optin_openai_research_panel.py'
      - 'tests/test_phase1_optin_openai_research_panel.py'
      - '.github/workflows/phase1-optin-openai-analysts.yml'
permissions:
  contents: read
jobs:
  fully-offline-mocked-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch immutable source archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            -o "${RUNNER_TEMP}/src.tar.gz"
          tar -xzf "${RUNNER_TEMP}/src.tar.gz" --strip-components=1
          test -f ci/phase1_optin_openai_research_panel.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install research and test libraries only
        run: |
          python -m pip install -q -r requirements.txt -r requirements-dev.txt
          python -m pip install -q pytest==8.3.5
      - name: Verify 5 analyst outputs, no-order schema, clock deadline, consent
        env:
          OPENAI_API_KEY: ''
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short \
            tests/test_phase1_optin_openai_research_panel.py \
            tests/test_phase1_pit_multiagent_advisory.py \
            tests/test_phase1_pit_decision_scorecard.py
          python -m py_compile ci/phase1_optin_openai_research_panel.py
