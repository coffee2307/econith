name: ECONITH Phase1 explicit Spot epoch recovery offline
on:
  push:
    branches:
      - 'experiment/phase1-spot-explicit-epoch-recovery-*'
    paths:
      - 'ci/phase1_spot_epoch_restart.py'
      - 'ci/phase1_spot_epoch_audit.py'
      - 'tests/test_phase1_spot_epoch_restart.py'
      - '.github/workflows/phase1-spot-epoch-restart.yml'
  pull_request:
    paths:
      - 'ci/phase1_spot_epoch_restart.py'
      - 'ci/phase1_spot_epoch_audit.py'
      - 'tests/test_phase1_spot_epoch_restart.py'
      - '.github/workflows/phase1-spot-epoch-restart.yml'
permissions:
  contents: read
jobs:
  two-isolated-offline-source-epochs:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Fetch exact immutable source commit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            -o "${RUNNER_TEMP}/econith-epoch-source.tar.gz"
          tar -xzf "${RUNNER_TEMP}/econith-epoch-source.tar.gz" --strip-components=1
          test -f ci/phase1_spot_epoch_restart.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install deterministic research-only dependencies
        run: |
          python -m pip install -q -r requirements.txt -r requirements-dev.txt
          python -m pip install -q pytest==8.3.5 pytest-asyncio==0.26.0 httpx==0.28.1 websockets==14.2
      - name: Refuse unknown gap, audit old prefix, require fresh lease/REST and HMAC checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short tests/test_phase1_spot_epoch_restart.py
          python -m py_compile ci/phase1_spot_epoch_restart.py ci/phase1_spot_epoch_audit.py
