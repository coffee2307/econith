name: ECONITH Phase1 rotating postseal HMAC receiver qualification
on:
  push:
    branches:
      - 'experiment/phase1-rotating-hmac-handoff-*'
    paths:
      - 'ci/phase1_rotating_spot_source.py'
      - 'ci/phase1_rotating_hmac_handoff.py'
      - 'ci/phase1_rotating_hmac_audit.py'
      - 'tests/test_phase1_rotating_hmac_handoff.py'
      - '.github/workflows/phase1-rotating-hmac-postseal.yml'
  pull_request:
    paths:
      - 'ci/phase1_rotating_spot_source.py'
      - 'ci/phase1_rotating_hmac_handoff.py'
      - 'ci/phase1_rotating_hmac_audit.py'
      - 'tests/test_phase1_rotating_hmac_handoff.py'
      - '.github/workflows/phase1-rotating-hmac-postseal.yml'
permissions:
  contents: read
jobs:
  offline-sealed-ack-checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Pin exact tested repository contents
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            -o "${RUNNER_TEMP}/source.tar.gz"
          tar -xzf "${RUNNER_TEMP}/source.tar.gz" --strip-components=1
          test -f tests/test_phase1_rotating_hmac_handoff.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install first-party offline research + pytest dependencies
        run: |
          python -m pip install -q -r requirements.txt -r requirements-dev.txt
          python -m pip install -q pytest==8.3.5 pytest-asyncio==0.26.0 httpx==0.28.1 websockets==14.2
      - name: Offline HMAC child-process, derived observers, checkpoint, crash fault proof
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short tests/test_phase1_rotating_hmac_handoff.py
          python -m py_compile ci/phase1_rotating_hmac_handoff.py ci/phase1_rotating_hmac_audit.py
