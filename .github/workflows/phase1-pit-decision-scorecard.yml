name: ECONITH P1-07 finite forward decision scorecard
on:
  push:
    branches:
      - 'experiment/phase1-pit-decision-scorecard-*'
    paths:
      - 'ci/phase1_pit_decision_scorecard.py'
      - 'tests/test_phase1_pit_decision_scorecard.py'
      - '.github/workflows/phase1-pit-decision-scorecard.yml'
      - 'docs/architecture/PHASE1_PIT_DECISION_OUTCOME_SCORECARD_20261020.md'
  pull_request:
    paths:
      - 'ci/phase1_pit_decision_scorecard.py'
      - 'tests/test_phase1_pit_decision_scorecard.py'
      - '.github/workflows/phase1-pit-decision-scorecard.yml'
permissions:
  contents: read
jobs:
  finite-pit-scorecard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Exact GitHub commit archive without stale submodule lookup
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            -o "${RUNNER_TEMP}/econith-source.tar.gz"
          tar -xzf "${RUNNER_TEMP}/econith-source.tar.gz" --strip-components=1
          test -f tests/test_phase1_pit_decision_scorecard.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install local test dependencies only
        run: |
          python -m pip install -q -r requirements.txt -r requirements-dev.txt
          python -m pip install -q pytest==8.3.5
      - name: Exercise forward PIT scoring and adversarial source vintage
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short \
            tests/test_phase1_pit_decision_scorecard.py \
            tests/test_phase1_pit_multiagent_advisory.py \
            tests/test_phase1_spot_multiasset_ohlcv.py
          python -m py_compile ci/phase1_pit_decision_scorecard.py
