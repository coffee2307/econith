name: ECONITH Phase1 single-socket owner fencing and crash qualification
on:
  push:
    branches:
      - 'experiment/phase1-owner-fence-duration-*'
    paths:
      - 'ci/phase1_single_socket_duration_trial.py'
      - 'ci/phase1_single_socket_duration_audit.py'
      - 'tests/test_phase1_single_socket_duration.py'
      - '.github/workflows/phase1-single-socket-owner-fence.yml'
  pull_request:
    paths:
      - 'ci/phase1_single_socket_duration_trial.py'
      - 'ci/phase1_single_socket_duration_audit.py'
      - 'tests/test_phase1_single_socket_duration.py'
      - '.github/workflows/phase1-single-socket-owner-fence.yml'
permissions:
  contents: read
jobs:
  offline-crash-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact immutable HEAD code
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            -o "${RUNNER_TEMP}/source.tar.gz"
          tar -xzf "${RUNNER_TEMP}/source.tar.gz" --strip-components=1
          test -f tests/test_phase1_single_socket_duration.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install exact pinned offline test dependencies
        run: python -m pip install -q pytest==8.3.5 pytest-asyncio==0.26.0 httpx==0.28.1 websockets==14.2
      - name: Lock/owner concurrent takeover, OS hard exit, stale socket and raw integrity
        run: |
          python -m pytest -q --tb=short tests/test_phase1_single_socket_duration.py
          python -m py_compile ci/phase1_single_socket_duration_trial.py ci/phase1_single_socket_duration_audit.py
