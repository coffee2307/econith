name: ECONITH P1-07 Point-in-Time Multiagent Advisory Contract
on:
  push:
    branches:
      - 'experiment/phase1-p107-pit-multiagent-contract-*'
    paths:
      - 'ci/phase1_pit_multiagent_advisory.py'
      - 'tests/test_phase1_pit_multiagent_advisory.py'
      - 'docs/architecture/ECONITH_VS_TRADINGAGENTS_REVIEW_20261020.md'
      - '.github/workflows/phase1-p107-pit-multiagent-advisory.yml'
  pull_request:
    paths:
      - 'ci/phase1_pit_multiagent_advisory.py'
      - 'tests/test_phase1_pit_multiagent_advisory.py'
      - '.github/workflows/phase1-p107-pit-multiagent-advisory.yml'
permissions:
  contents: read
jobs:
  offline-pit-advisory:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fetch immutable repository commit without unsupported submodules
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            -o "${RUNNER_TEMP}/src.tar.gz"
          tar -xzf "${RUNNER_TEMP}/src.tar.gz" --strip-components=1
          test -f tests/test_phase1_pit_multiagent_advisory.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test prerequisites
        run: |
          python -m pip install -q -r requirements.txt -r requirements-dev.txt
          python -m pip install -q pytest==8.3.5
      - name: No-network source SHA, PIT, roles and risk veto test
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short \
            tests/test_phase1_pit_multiagent_advisory.py \
            tests/test_phase1_spot_multiasset_ohlcv.py \
            tests/test_phase1_default_source_boundary_audit.py
          python -m py_compile ci/phase1_pit_multiagent_advisory.py
