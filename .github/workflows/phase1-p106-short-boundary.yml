name: ECONITH Phase1 verified-only runtime route/WS security boundary (short gate)
on:
  push:
    branches:
      - 'experiment/phase1-p106-runtime-boundary-deferred-soak-*'
    paths:
      - 'ci/phase1_default_source_boundary_audit.py'
      - 'tests/test_phase1_default_source_boundary_audit.py'
      - 'tests/test_phase1_verified_only_route_fence.py'
      - '.github/workflows/phase1-p106-short-boundary.yml'
  pull_request:
    paths:
      - 'ci/phase1_default_source_boundary_audit.py'
      - 'tests/test_phase1_default_source_boundary_audit.py'
      - 'tests/test_phase1_verified_only_route_fence.py'
      - '.github/workflows/phase1-p106-short-boundary.yml'
permissions:
  contents: read
jobs:
  runtime-boundary-short-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Immutable source archive, no broken legacy submodules
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            -o "${RUNNER_TEMP}/src.tar.gz"
          tar -xzf "${RUNNER_TEMP}/src.tar.gz" --strip-components=1
          test -f tests/test_phase1_verified_only_route_fence.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install app test environment
        run: |
          python -m pip install -q -r requirements.txt -r requirements-dev.txt
          python -m pip install -q pytest==8.3.5 pytest-asyncio==0.26.0 httpx==0.28.1
      - name: Fail closed on HTTP/WS allowlist or protected startup regressions
        run: |
          set -euo pipefail
          python -m ci.phase1_default_source_boundary_audit
          python -m pytest -q --tb=short \
            tests/test_phase1_default_source_boundary_audit.py \
            tests/test_phase1_verified_only_route_fence.py \
            tests/test_spot_verified_cutover_gate.py
