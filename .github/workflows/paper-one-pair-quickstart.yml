name: ECONITH one-pair paper bot — no live orders

on:
  pull_request:
    paths:
      - "scripts/paper_trade_quickstart.py"
      - "tests/test_paper_trade_quickstart.py"
      - ".github/workflows/paper-one-pair-quickstart.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-one-pair-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline Python tests
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Next-bar execution, capital bounds, fee stress and PnL reconciliation
        run: |
          python -m pytest -q --tb=short \
            tests/test_paper_trade_quickstart.py \
            tests/test_paper_v1.py \
            tests/test_paper_audit.py

  public-spot-replay:
    needs: offline-one-pair-paper
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: One public BTC/USDT historical replay with virtual 100 USDT
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/econith-paper-${GITHUB_RUN_ID}"
          python -m scripts.paper_trade_quickstart \
            --symbol BTCUSDT --capital 100 \
            --interval 4h --candles 500 \
            --allow-public-market-data --simulation-only \
            --output-dir "$root" | tee "${RUNNER_TEMP}/paper_summary.json"
          python -m econith.quant.paper_audit \
            --report "$root/base_replay.json" \
            --output "${RUNNER_TEMP}/paper_reaudit.json"
      - name: Stage only summary metadata, not all market or trade data
        if: always()
        shell: bash
        run: |
          stage="${RUNNER_TEMP}/econith-paper-aggregate"
          mkdir -p "$stage"
          for name in paper_summary paper_reaudit; do
            test ! -f "${RUNNER_TEMP}/${name}.json" || cp "${RUNNER_TEMP}/${name}.json" "$stage/${name}.json"
          done
      - name: Retain virtual replay summary (3 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: econith-one-pair-paper-${{ github.run_id }}
          path: ${{ runner.temp }}/econith-paper-aggregate/
          retention-days: 3
          if-no-files-found: warn
