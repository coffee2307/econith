name: ECONITH P1-10 risk-first efficiency and verified runtime isolation

on:
  pull_request:
    paths:
      - "ci/phase1_risk_first_research.py"
      - "tests/test_phase1_risk_first_research.py"
      - "tests/test_phase1_p106_adversarial_runtime_matrix.py"
      - ".github/workflows/phase1-p110-risk-first-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-and-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Mocked risk-first research plus adversarial isolated runtimes
        run: |
          python -m pytest -q --tb=short \
            tests/test_phase1_risk_first_research.py \
            tests/test_phase1_p106_adversarial_runtime_matrix.py \
            tests/test_phase1_optin_openai_research_panel.py \
            tests/test_phase1_verified_only_route_fence.py \
            tests/test_phase1_default_source_boundary_audit.py
