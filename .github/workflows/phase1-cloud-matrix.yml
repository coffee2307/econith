name: ECONITH Phase 1 cloud finite matrix (one-shot)

# Unique ephemeral research branch and file path. This is triggered once by
# publishing this workflow file, never on PRs, main, schedule, or deployment.
on:
  push:
    branches:
      - experiment/phase1-cloud-public-20261019
    paths:
      - .github/workflows/phase1-cloud-matrix.yml

permissions:
  contents: read

concurrency:
  group: econith-phase1-public-one-shot-20261019
  cancel-in-progress: false

jobs:
  matrix-research:
    name: Read-only Binance Spot finite 3x1000
    if: ${{ github.repository == 'coffee2307/econith' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      ECONITH_MODE: SIMULATION
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      EVIDENCE_ROOT: ${{ runner.temp }}/econith-phase1-finite-public
    steps:
      - name: Checkout review-only experiment (no persistent Git credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned read-only research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify policies and SQLite fault-recovery tests
        run: |
          python -m pytest -q --tb=short \
            tests/test_phase1_public_fullcache_matrix.py \
            tests/test_phase1_public_live_spool_matrix.py \
            tests/test_phase1_cached_original_invariants.py \
            tests/test_phase1_cached_receiver_invariants.py \
            tests/test_phase1_spool_physical_kill.py
      - name: Cloud resource guard before any exchange network request
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          from ci.phase1_cloud_resources import host_snapshot
          root=Path(os.environ["EVIDENCE_ROOT"])
          root.mkdir(parents=True,exist_ok=False)
          state=host_snapshot(root)
          print("RUNNER_MEMORY_AVAILABLE_GB",round(state["available_memory_bytes"]/1e9,2))
          print("RUNNER_DISK_AVAILABLE_GB",round(state["disk_free_bytes"]/1e9,2))
          assert state["available_memory_bytes"] >= 1_500_000_000, "RAM guard refused"
          assert state["disk_free_bytes"] >= 2_000_000_000, "disk guard refused"
          PY
      - name: Public data-only bounded Binance 3x1000 (no exchange credentials)
        run: |
          python -m ci.phase1_public_live_spool_matrix \
            --allow-public-market-data \
            --accept-experimental-spool \
            --reuse-derived-connections \
            --reuse-producer-connections \
            --reuse-receiver-connection \
            --reuse-original-connection \
            --diagnose-pressure \
            --output-dir "${{ runner.temp }}/econith-phase1-finite-public-session" \
            --frames 1000 \
            --max-lag-ms 5000
      - name: Read-only forensic reconciliation (never certifies continuity)
        if: ${{ always() }}
        run: |
          python -m ci.phase1_cloud_matrix_audit \
            --root "${{ runner.temp }}/econith-phase1-finite-public-session"
      - name: Package public-safe aggregates only (no raw SQLite)
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/econith-safe-reports"
          root="${{ runner.temp }}/econith-phase1-finite-public-session"
          for name in matrix_report.json cloud_audit.json; do
            if [ -f "$root/$name" ]; then
              cp "$root/$name" "${{ runner.temp }}/econith-safe-reports/$name"
            fi
          done
          for index in 001 002 003; do
            mkdir -p "${{ runner.temp }}/econith-safe-reports/attempt_$index"
            for name in projector_lag.json spool_pressure.json stage_latency.json; do
              if [ -f "$root/attempt_$index/$name" ]; then
                cp "$root/attempt_$index/$name" "${{ runner.temp }}/econith-safe-reports/attempt_$index/$name"
              fi
            done
          done
          echo "Only aggregate diagnostics and verdicts were staged; raw market data, original ledgers, HMAC material and database files were not uploaded."
      - name: Upload aggregate evidence (short-lived public repo artifact)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: econith-phase1-cloud-finite-${{ github.run_id }}
          path: ${{ runner.temp }}/econith-safe-reports/
          retention-days: 3
          if-no-files-found: warn
