name: econith-production

services:
  caddy:
    image: caddy:2-alpine
    container_name: econith_caddy
    env_file: ./.env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend_core:
        condition: service_healthy
      frontend_dashboard:
        condition: service_healthy
    restart: unless-stopped
    networks: [econith_net]

  backend_core:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_ML: "false"
    container_name: econith_backend_core
    env_file: ./.env.production
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      API_AUTH_ENABLED: "true"
      API_KEYS: ${ECONITH_API_KEY:?Set ECONITH_API_KEY in .env.production}
      DATABASE_URL: postgresql://econith:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/econith
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      MODEL_DIR: /app/models
      MODEL_REGISTRY: /app/models/registry
      WORLD_SIMULATION_DEFAULT: ${WORLD_SIMULATION_DEFAULT:-true}
      ECONITH_MOCK_TWAP: "false"
      # Remote provider is the reliable first route. Ollama is an optional
      # fallback enabled with the local-llm profile on a sufficiently large VPS.
      LOCAL_LLM_ENABLED: ${LOCAL_LLM_ENABLED:-false}
      LOCAL_LLM_BASE_URL: http://ollama:11434/v1
      LOCAL_LLM_FIRST: "false"
      LOCAL_LLM_TIMEOUT_S: ${LOCAL_LLM_TIMEOUT_S:-60}
      LOCAL_LLM_QUEUE_TIMEOUT_S: "1"
      HYPOTHESIS_USE_LLM: ${HYPOTHESIS_USE_LLM:-true}
      BINANCE_EXECUTION_ENV: demo
      BINANCE_TESTNET: "true"
    expose:
      - "8000"
    volumes:
      - ./runtime/models:/app/models:ro
      - ./runtime/datasets:/app/datasets
      - ./runtime/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    networks: [econith_net]

  frontend_dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.prod
    container_name: econith_frontend_dashboard
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      - backend_core
    restart: unless-stopped
    networks: [econith_net]

  postgres:
    image: postgres:16-alpine
    container_name: econith_postgres
    environment:
      POSTGRES_USER: econith
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: econith
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U econith -d econith"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [econith_net]

  redis:
    image: redis:7-alpine
    container_name: econith_redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [econith_net]

  # Optional CPU/GPU local open-source model. On an 8 GB VPS use a small
  # quantized model; keep remote LLM first so inference cannot stall the demo.
  ollama:
    image: ollama/ollama:latest
    container_name: econith_ollama
    profiles: ["local-llm"]
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    restart: unless-stopped
    networks: [econith_net]

networks:
  econith_net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  redisdata:
  ollama_data:
