# EXP_001 — Baseline vs ECONITH (RQ1) — cấu hình chính
#
# Baseline (B0): forecast future realized vol from historical rolling vol only
#   (market data persistence — no World).
# Experimental (E1): oos_beta — B0 + β·(L_lag(vol_mult)/μ_train − 1); β/lag fit
#   on train after boundary purge; metrics on test only.
# Control (C1): shuffle lagged regressor after β is fixed.
#
# Dataset: datasets/features/BTCUSDT_features.parquet (real; not fabricated)

id: EXP_001
rq: RQ1
seed: 42
symbol: BTCUSDT
protocol: oos_beta
train_frac: 0.70
max_rows: 30000
stride: 5
hist_vol_window: 60
fwd_vol_horizon: 60
macro_sample_every: 10
status_if_missing_data: blocked
